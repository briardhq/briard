# The release signature: the one place the release key is used.
#
# The key is a secret of the `release` environment, whose deployments are restricted to main and
# need one required reviewer, so a push of releases/** starts this job and it waits until that
# reviewer approves it. It signs every manifest with no signature and commits the signatures with
# the built-in token, whose commits start no further workflow. The machine that publishes pulls and
# verifies them (scripts/publish-release.sh `sign`): it holds the publish credential and not the
# key, and this job holds the key and not the credential.
#
# No third-party action and no checkout action: the key is exposed to the runner and to the lines
# below, nothing else. A manifest is signed once. Its id never names other bytes, so one that has a
# signature has its signature, and a rotated key does not re-sign the history.
name: sign

on:
  push:
    branches: [main]
    paths: ['releases/**']

concurrency:
  group: sign
  cancel-in-progress: false

permissions: {}

jobs:
  sign:
    if: github.repository == 'briardhq/briard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Sign the manifests that have no signature
        shell: bash
        env:
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key=$RUNNER_TEMP/release.pem
          pub=$RUNNER_TEMP/release.pub
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGN_KEY" > "$key"
          unset RELEASE_SIGN_KEY
          openssl pkey -in "$key" -pubout -out "$pub"
          git clone --quiet --depth=1 --branch main "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          signed=0
          while IFS= read -r m; do
            [ ! -e "$m.sig" ] || continue
            # -rawin is PureEdDSA over the whole file, which is what a node verifies.
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$m" -out "$m.sig"
            [ "$(stat -c%s "$m.sig")" = 64 ]
            openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$m" -sigfile "$m.sig" >/dev/null
            git add "$m.sig"
            echo "signed $m"
            signed=$((signed + 1))
          done < <(find releases -name manifest.json | sort)
          if [ "$signed" = 0 ]; then
            echo "nothing to sign"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "release: sign $signed manifests"
          for _ in 1 2 3; do
            git push --quiet origin HEAD:main && exit 0
            git pull --quiet --rebase origin main
          done
          echo "cannot push the signatures to main" >&2
          exit 1
