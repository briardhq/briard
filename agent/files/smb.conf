[global]
  server role = standalone server
  passdb backend = smbpasswd:/briard/smbpasswd
  server min protocol = SMB3
  disable netbios = yes
  smb ports = 445
  map to guest = never
  restrict anonymous = 2
  server smb encrypt = desired
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1

[Briard]
  path = /srv
  read only = no
  force user = root
  valid users = @USERS@
  map archive = no
  create mask = 0644
  directory mask = 0755
