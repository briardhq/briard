# Briard's mosquitto configuration. It is NOT the user's to edit: this file is rendered into the
# guest's /run by every converge and bound read-only into the container, so a node re-derives it
# at every promotion and every guest boot. What a household configures lives in the broker's
# retained state, on the replicated volume.
#
# The image's own baked config would also start a broker, and would be wrong in two ways
# (measured against eclipse-mosquitto 2.1.2, the pinned entry): it leaves persistence OFF, so
# every failover would silently drop retained messages -- MQTT discovery topics and the last
# reading of a sensor that publishes once a day -- and it binds the management API to every
# interface.

# The broker itself, open to the LAN. That is what a broker is for: ESPHome nodes, Zigbee
# bridges and Home Assistant all reach it over the network, and Home Assistant reaches it on
# the guest's own loopback because both services share the guest's network namespace.
#
# Anonymous, deliberately and for now: it is upstream's own default, it is what makes the
# household's MQTT setup two fields and no secret, and every alternative needs a credential
# delivered to every device. Revisit when there is a way to hand one out ([V3b.4]).
listener 1883
allow_anonymous true

# The management API, on the loopback ONLY. It is what the health floor probes -- the broker
# answers /api/v1/listeners from its own process, so a 200 there means the broker is serving and
# not merely that a port is open. Three read-only GET routes exist in 2.1.2 (listeners, systree,
# version; there are no others in the binary), so this is low-risk to expose -- and it is still
# not exposed, because nothing outside the guest has any business reading it.
#
# No http_dir: without it the bundled dashboard is not served, and the API answers exactly the
# same (measured). One less thing on a port.
#
# The FRONT DOOR runs inside this guest, so "bound to loopback" stops being the whole answer the
# moment something in here proxies by name ([B.48]). That is why the broker is marked not-fronted
# (agent/services.Fronted): the routing table would otherwise have republished this listener on the
# LAN under the service's own name, undoing this bind through a mechanism that never mentions it.
listener 9883 127.0.0.1
protocol http_api

# Persistence is what makes this a service with DATA rather than a process. mosquitto.db lands in
# the service's replicated subvolume, so retained messages survive a restart, an upgrade and a
# failover -- and roll back with everything else when an upgrade is reverted.
#
# autosave_interval is upstream's 1800s by default, which would put half an hour of retained
# state at risk of an abrupt failover. 30s is the window we are willing to lose; the broker also
# writes the file on a clean stop, which is what a planned handover does.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
